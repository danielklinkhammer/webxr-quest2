<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebXR Passthrough Hand-Tracking Demo – Meta Quest 2</title>
  <meta name="description" content="A-Frame WebXR MR passthrough scene with hand tracking for Meta Quest 2">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>
  <!-- environment component removed for passthrough/AR mode -->
  <style>
    body { margin: 0; overflow: hidden; }
    .enter-vr {
      font-family: 'Segoe UI', system-ui, sans-serif;
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: white; padding: 14px 28px;
      border-radius: 12px; font-size: 16px; z-index: 999;
      pointer-events: none; text-align: center;
    }
  </style>
</head>
<body>

<div class="enter-vr">
  Öffne diese Seite im Meta Quest Browser und tippe auf "Enter AR"
</div>

<script>
// ──────────────────────────────────────────────
// Custom component: objects react to hand pinch
// ──────────────────────────────────────────────
AFRAME.registerComponent('hand-interactive', {
  schema: {
    color: { type: 'color', default: '#4CC3D9' },
    hoverColor: { type: 'color', default: '#FFD700' },
    activeColor: { type: 'color', default: '#FF6B6B' }
  },

  init: function () {
    this.originalScale = this.el.getAttribute('scale') || { x: 1, y: 1, z: 1 };
    this.isHovered = false;
    this.el.setAttribute('material', 'color', this.data.color);
    this.el.setAttribute('class', 'interactive');
  }
});

// ──────────────────────────────────────────────
// Hand collision detection component
// ──────────────────────────────────────────────
AFRAME.registerComponent('hand-collider', {
  schema: {
    hand: { type: 'string', default: 'left' }
  },

  init: function () {
    this.indexTip = null;
    this.thumbTip = null;
    this.isPinching = false;
    this.grabbedEl = null;
    this.grabOffset = new THREE.Vector3();
    this.raycaster = new THREE.Raycaster();
    this.tempMatrix = new THREE.Matrix4();
    this.handPosition = new THREE.Vector3();
    this.pinchMidpoint = new THREE.Vector3();
  },

  tick: function () {
    const hand = this.el.components['hand-tracking-controls'];
    if (!hand || !hand.mesh) return;

    // Get index and thumb tip positions from the hand mesh
    const joints = hand.mesh?.skeleton?.bones;
    if (!joints) return;

    let indexTip = null;
    let thumbTip = null;

    for (let i = 0; i < joints.length; i++) {
      const name = joints[i].name.toLowerCase();
      if (name.includes('index') && name.includes('tip')) {
        indexTip = joints[i];
      }
      if (name.includes('thumb') && name.includes('tip')) {
        thumbTip = joints[i];
      }
    }

    if (!indexTip || !thumbTip) return;

    // Get world positions
    const indexPos = new THREE.Vector3();
    const thumbPos = new THREE.Vector3();
    indexTip.getWorldPosition(indexPos);
    thumbTip.getWorldPosition(thumbPos);

    const distance = indexPos.distanceTo(thumbPos);
    const wasPinching = this.isPinching;
    this.isPinching = distance < 0.03; // 3cm threshold

    // Calculate midpoint between index and thumb
    this.pinchMidpoint.copy(indexPos).add(thumbPos).multiplyScalar(0.5);

    // Find closest interactive object
    const interactives = document.querySelectorAll('.interactive');

    if (this.isPinching && !wasPinching) {
      // Pinch started - try to grab
      let closest = null;
      let closestDist = 0.15; // 15cm grab radius

      interactives.forEach(el => {
        const pos = new THREE.Vector3();
        el.object3D.getWorldPosition(pos);
        const d = pos.distanceTo(this.pinchMidpoint);
        if (d < closestDist) {
          closestDist = d;
          closest = el;
        }
      });

      if (closest) {
        this.grabbedEl = closest;
        const objPos = new THREE.Vector3();
        this.grabbedEl.object3D.getWorldPosition(objPos);
        this.grabOffset.copy(objPos).sub(this.pinchMidpoint);

        // Visual feedback
        this.grabbedEl.setAttribute('material', 'color',
          this.grabbedEl.getAttribute('hand-interactive').activeColor);
        this.grabbedEl.setAttribute('animation', {
          property: 'scale',
          to: '1.2 1.2 1.2',
          dur: 150,
          easing: 'easeOutQuad'
        });
      }
    } else if (!this.isPinching && wasPinching) {
      // Pinch released - drop
      if (this.grabbedEl) {
        this.grabbedEl.setAttribute('material', 'color',
          this.grabbedEl.getAttribute('hand-interactive').color);
        this.grabbedEl.setAttribute('animation', {
          property: 'scale',
          to: '1 1 1',
          dur: 200,
          easing: 'easeOutQuad'
        });
        this.grabbedEl = null;
      }
    }

    if (this.isPinching && this.grabbedEl) {
      // Move grabbed object
      const newPos = this.pinchMidpoint.clone().add(this.grabOffset);
      // Convert to local coords if needed
      if (this.grabbedEl.parentEl && this.grabbedEl.parentEl.object3D) {
        this.grabbedEl.parentEl.object3D.worldToLocal(newPos);
      }
      this.grabbedEl.setAttribute('position', newPos);
    }

    // Hover effect for non-grabbed objects
    interactives.forEach(el => {
      if (el === this.grabbedEl) return;
      const pos = new THREE.Vector3();
      el.object3D.getWorldPosition(pos);
      const d = pos.distanceTo(this.pinchMidpoint);
      const comp = el.getAttribute('hand-interactive');
      if (d < 0.12) {
        el.setAttribute('material', 'color', comp.hoverColor);
      } else {
        el.setAttribute('material', 'color', comp.color);
      }
    });
  }
});

// ──────────────────────────────────────────────
// Floating animation component
// ──────────────────────────────────────────────
AFRAME.registerComponent('float-animation', {
  schema: {
    amplitude: { type: 'number', default: 0.1 },
    speed: { type: 'number', default: 1 },
    phase: { type: 'number', default: 0 }
  },

  init: function () {
    this.originalY = this.el.getAttribute('position').y;
    this.time = this.data.phase;
  },

  tick: function (t, dt) {
    this.time += (dt / 1000) * this.data.speed;
    const newY = this.originalY + Math.sin(this.time) * this.data.amplitude;
    const pos = this.el.getAttribute('position');
    this.el.setAttribute('position', { x: pos.x, y: newY, z: pos.z });
  }
});

// ──────────────────────────────────────────────
// Particle burst on pinch component
// ──────────────────────────────────────────────
AFRAME.registerComponent('pinch-particles', {
  init: function () {
    this.particles = [];
    this.scene = this.el.sceneEl.object3D;
  },

  createBurst: function (position, color) {
    for (let i = 0; i < 8; i++) {
      const geo = new THREE.SphereGeometry(0.008, 6, 6);
      const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(position);

      const velocity = new THREE.Vector3(
        (Math.random() - 0.5) * 0.8,
        Math.random() * 0.5 + 0.2,
        (Math.random() - 0.5) * 0.8
      );

      this.scene.add(mesh);
      this.particles.push({ mesh, velocity, life: 1.0 });
    }
  },

  tick: function (t, dt) {
    const delta = dt / 1000;
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.life -= delta * 2;
      p.mesh.position.add(p.velocity.clone().multiplyScalar(delta));
      p.velocity.y -= delta * 1.5; // gravity
      p.mesh.material.opacity = Math.max(0, p.life);
      p.mesh.scale.setScalar(p.life);

      if (p.life <= 0) {
        this.scene.remove(p.mesh);
        p.mesh.geometry.dispose();
        p.mesh.material.dispose();
        this.particles.splice(i, 1);
      }
    }
  }
});
</script>

<a-scene
  webxr="requiredFeatures: hand-tracking, local-floor; optionalFeatures: bounded-floor, mesh-detection, plane-detection; referenceSpaceType: local-floor;"
  renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true; alpha: true"
  background="transparent: true"
  vr-mode-ui="enabled: true; enterARButton: #enterARButton; enterVRButton: #enterARButton"
  ar-mode-ui="enabled: true"
>
  <!-- Assets -->
  <a-assets>
    <a-mixin id="interactive-defaults"
      animation__mouseenter="property: scale; to: 1.1 1.1 1.1; dur: 200; startEvents: mouseenter"
      animation__mouseleave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"
    ></a-mixin>
  </a-assets>

  <!-- No environment — passthrough shows real world -->

  <!-- Lighting tuned for AR/MR passthrough -->
  <a-entity light="type: ambient; color: #ffffff; intensity: 0.6"></a-entity>
  <a-entity light="type: directional; color: #ffffff; intensity: 0.5" position="2 4 1"></a-entity>
  <a-entity light="type: point; color: #e94560; intensity: 0.4; distance: 4" position="0 1.5 -1"></a-entity>

  <!-- ═══════════════════════════════════════ -->
  <!--       Interactive Objects Table         -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Pedestal / Table (semi-transparent for AR) -->
  <a-entity position="0 0.6 -1.2">
    <a-cylinder color="#16213e" radius="0.5" height="0.03" material="metalness: 0.5; roughness: 0.3; transparent: true; opacity: 0.7"></a-cylinder>
    <a-cylinder color="#0f3460" radius="0.45" height="0.015" position="0 0.025 0" material="metalness: 0.8; roughness: 0.1; emissive: #0f3460; emissiveIntensity: 0.5; transparent: true; opacity: 0.8"></a-cylinder>
  </a-entity>

  <!-- Floating objects to grab -->
  <a-box
    hand-interactive="color: #e94560; hoverColor: #FFD700; activeColor: #FF9999"
    float-animation="amplitude: 0.06; speed: 1.2; phase: 0"
    position="-0.25 0.8 -1.2"
    width="0.12" height="0.12" depth="0.12"
    rotation="0 45 0"
    material="metalness: 0.3; roughness: 0.4"
    shadow
  ></a-box>

  <a-sphere
    hand-interactive="color: #4CC3D9; hoverColor: #FFD700; activeColor: #99DDFF"
    float-animation="amplitude: 0.08; speed: 0.9; phase: 1.5"
    position="0 0.9 -1.2"
    radius="0.08"
    material="metalness: 0.5; roughness: 0.2"
    shadow
  ></a-sphere>

  <a-dodecahedron
    hand-interactive="color: #7B2FBE; hoverColor: #FFD700; activeColor: #BB88FF"
    float-animation="amplitude: 0.05; speed: 1.5; phase: 3.0"
    position="0.25 0.75 -1.2"
    radius="0.09"
    material="metalness: 0.4; roughness: 0.3"
    shadow
  ></a-dodecahedron>

  <a-torus
    hand-interactive="color: #FFC300; hoverColor: #FF6B6B; activeColor: #FFEE88"
    float-animation="amplitude: 0.07; speed: 1.1; phase: 4.5"
    position="0 1.0 -1.1"
    radius="0.07" radius-tubular="0.02"
    rotation="90 0 0"
    material="metalness: 0.6; roughness: 0.2"
    shadow
  ></a-torus>

  <a-octahedron
    hand-interactive="color: #00B894; hoverColor: #FFD700; activeColor: #55EEBB"
    float-animation="amplitude: 0.09; speed: 0.8; phase: 2.0"
    position="-0.15 0.95 -1.3"
    radius="0.07"
    material="metalness: 0.5; roughness: 0.25"
    shadow
  ></a-octahedron>

  <!-- ═══════════════════════════════════════ -->
  <!--          Decorative Elements            -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Glowing ring around pedestal -->
  <a-torus
    position="0 0.62 -1.2"
    rotation="90 0 0"
    radius="0.52" radius-tubular="0.005"
    material="color: #e94560; emissive: #e94560; emissiveIntensity: 0.8; transparent: true; opacity: 0.6"
    animation="property: rotation; to: 90 360 0; dur: 20000; loop: true; easing: linear"
  ></a-torus>

  <!-- Floating info text -->
  <a-text
    value="Greife Objekte mit\nDaumen + Zeigefinger"
    position="0 1.4 -1.2"
    align="center"
    color="#333333"
    width="1.2"
    opacity="0.9"
    animation="property: position; to: 0 1.45 -1.2; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine"
  ></a-text>

  <!-- Orbiting light orbs for atmosphere -->
  <a-entity position="0 0.9 -1.2" animation="property: rotation; to: 0 360 0; dur: 15000; loop: true; easing: linear">
    <a-sphere position="0.6 0 0" radius="0.015" material="color: #e94560; emissive: #e94560; emissiveIntensity: 1" light="type: point; color: #e94560; intensity: 0.15; distance: 1.5"></a-sphere>
  </a-entity>
  <a-entity position="0 0.8 -1.2" animation="property: rotation; to: 0 -360 0; dur: 12000; loop: true; easing: linear">
    <a-sphere position="0.5 0 0" radius="0.012" material="color: #4CC3D9; emissive: #4CC3D9; emissiveIntensity: 1" light="type: point; color: #4CC3D9; intensity: 0.1; distance: 1"></a-sphere>
  </a-entity>

  <!-- ═══════════════════════════════════════ -->
  <!--          Camera & Hand Tracking         -->
  <!-- ═══════════════════════════════════════ -->

  <a-entity id="cameraRig" position="0 0 0">
    <a-camera position="0 1.6 0" wasd-controls="enabled: true" look-controls="pointerLockEnabled: false">
      <!-- Cursor for non-VR interaction -->
      <a-cursor
        fuse="false"
        raycaster="objects: .interactive"
        material="color: white; shader: flat"
        geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.008"
      ></a-cursor>
    </a-camera>

    <!-- Hand tracking entities -->
    <a-entity
      id="leftHand"
      hand-tracking-controls="hand: left; modelColor: #4CC3D9; modelStyle: mesh"
      hand-collider="hand: left"
    ></a-entity>

    <a-entity
      id="rightHand"
      hand-tracking-controls="hand: right; modelColor: #e94560; modelStyle: mesh"
      hand-collider="hand: right"
    ></a-entity>

    <!-- Fallback controllers (Quest 2 Touch controllers) -->
    <a-entity
      laser-controls="hand: left"
      raycaster="objects: .interactive; showLine: true; lineColor: #4CC3D9; lineOpacity: 0.5; far: 5"
    ></a-entity>
    <a-entity
      laser-controls="hand: right"
      raycaster="objects: .interactive; showLine: true; lineColor: #e94560; lineOpacity: 0.5; far: 5"
    ></a-entity>
  </a-entity>

</a-scene>

</body>
</html>
