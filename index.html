<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WebXR Hand-Tracking Demo - Meta Quest 2</title>
  <meta name="description" content="A-Frame WebXR scene with hand tracking for Meta Quest 2">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.7/dist/aframe-environment-component.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .enter-vr {
      font-family: 'Segoe UI', system-ui, sans-serif;
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: white; padding: 14px 28px;
      border-radius: 12px; font-size: 16px; z-index: 999;
      pointer-events: none; text-align: center;
    }
  </style>
</head>
<body>
<div class="enter-vr">Open this page in Meta Quest Browser and tap "Enter VR"</div>
<script>
AFRAME.registerComponent('hand-interactive', {
  schema: {
    color: { type: 'color', default: '#4CC3D9' },
    hoverColor: { type: 'color', default: '#FFD700' },
    activeColor: { type: 'color', default: '#FF6B6B' }
  },
  init: function () {
    this.originalScale = this.el.getAttribute('scale') || { x: 1, y: 1, z: 1 };
    this.isHovered = false;
    this.el.setAttribute('material', 'color', this.data.color);
    this.el.setAttribute('class', 'interactive');
  }
});
AFRAME.registerComponent('hand-collider', {
  schema: { hand: { type: 'string', default: 'left' } },
  init: function () {
    this.isPinching = false;
    this.grabbedEl = null;
    this.grabOffset = new THREE.Vector3();
    this.pinchMidpoint = new THREE.Vector3();
  },
  tick: function () {
    var hand = this.el.components['hand-tracking-controls'];
    if (!hand || !hand.mesh) return;
    var joints = hand.mesh && hand.mesh.skeleton && hand.mesh.skeleton.bones;
    if (!joints) return;
    var indexTip = null, thumbTip = null;
    for (var i = 0; i < joints.length; i++) {
      var name = joints[i].name.toLowerCase();
      if (name.includes('index') && name.includes('tip')) indexTip = joints[i];
      if (name.includes('thumb') && name.includes('tip')) thumbTip = joints[i];
    }
    if (!indexTip || !thumbTip) return;
    var indexPos = new THREE.Vector3(), thumbPos = new THREE.Vector3();
    indexTip.getWorldPosition(indexPos);
    thumbTip.getWorldPosition(thumbPos);
    var distance = indexPos.distanceTo(thumbPos);
    var wasPinching = this.isPinching;
    this.isPinching = distance < 0.03;
    this.pinchMidpoint.copy(indexPos).add(thumbPos).multiplyScalar(0.5);
    var interactives = document.querySelectorAll('.interactive');
    if (this.isPinching && !wasPinching) {
      var closest = null, closestDist = 0.15;
      interactives.forEach(function(el) {
        var pos = new THREE.Vector3();
        el.object3D.getWorldPosition(pos);
        var d = pos.distanceTo(this.pinchMidpoint);
        if (d < closestDist) { closestDist = d; closest = el; }
      }.bind(this));
      if (closest) {
        this.grabbedEl = closest;
        var objPos = new THREE.Vector3();
        this.grabbedEl.object3D.getWorldPosition(objPos);
        this.grabOffset.copy(objPos).sub(this.pinchMidpoint);
        this.grabbedEl.setAttribute('material', 'color', this.grabbedEl.getAttribute('hand-interactive').activeColor);
        this.grabbedEl.setAttribute('animation', { property: 'scale', to: '1.2 1.2 1.2', dur: 150, easing: 'easeOutQuad' });
      }
    } else if (!this.isPinching && wasPinching && this.grabbedEl) {
      this.grabbedEl.setAttribute('material', 'color', this.grabbedEl.getAttribute('hand-interactive').color);
      this.grabbedEl.setAttribute('animation', { property: 'scale', to: '1 1 1', dur: 200, easing: 'easeOutQuad' });
      this.grabbedEl = null;
    }
    if (this.isPinching && this.grabbedEl) {
      var newPos = this.pinchMidpoint.clone().add(this.grabOffset);
      if (this.grabbedEl.parentEl && this.grabbedEl.parentEl.object3D) this.grabbedEl.parentEl.object3D.worldToLocal(newPos);
      this.grabbedEl.setAttribute('position', newPos);
    }
    interactives.forEach(function(el) {
      if (el === this.grabbedEl) return;
      var pos = new THREE.Vector3();
      el.object3D.getWorldPosition(pos);
      var d = pos.distanceTo(this.pinchMidpoint);
      var comp = el.getAttribute('hand-interactive');
      el.setAttribute('material', 'color', d < 0.12 ? comp.hoverColor : comp.color);
    }.bind(this));
  }
});
AFRAME.registerComponent('float-animation', {
  schema: { amplitude: { type: 'number', default: 0.1 }, speed: { type: 'number', default: 1 }, phase: { type: 'number', default: 0 } },
  init: function () { this.originalY = this.el.getAttribute('position').y; this.time = this.data.phase; },
  tick: function (t, dt) {
    this.time += (dt / 1000) * this.data.speed;
    var newY = this.originalY + Math.sin(this.time) * this.data.amplitude;
    var pos = this.el.getAttribute('position');
    this.el.setAttribute('position', { x: pos.x, y: newY, z: pos.z });
  }
});
</script>
<a-scene webxr="requiredFeatures: hand-tracking; optionalFeatures: local-floor, bounded-floor;" renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true" background="color: #1a1a2e" vr-mode-ui="enabled: true">
  <a-assets><a-mixin id="interactive-defaults" animation__mouseenter="property: scale; to: 1.1 1.1 1.1; dur: 200; startEvents: mouseenter" animation__mouseleave="property: scale; to: 1 1 1; dur: 200; startEvents: mouseleave"></a-mixin></a-assets>
  <a-entity environment="preset: starry; groundColor: #1a1a2e; groundColor2: #16213e; dressingAmount: 30; fog: 0.7; grid: none; skyType: atmosphere; skyColor: #0f3460"></a-entity>
  <a-entity light="type: ambient; color: #8899aa; intensity: 0.4"></a-entity>
  <a-entity light="type: directional; color: #ffffff; intensity: 0.8" position="2 4 1"></a-entity>
  <a-entity light="type: point; color: #e94560; intensity: 0.6; distance: 8" position="0 2.5 -2"></a-entity>
  <a-entity position="0 0.6 -1.8">
    <a-cylinder color="#16213e" radius="0.6" height="0.05" material="metalness: 0.5; roughness: 0.3"></a-cylinder>
    <a-cylinder color="#0f3460" radius="0.55" height="0.02" position="0 0.035 0" material="metalness: 0.8; roughness: 0.1; emissive: #0f3460; emissiveIntensity: 0.3"></a-cylinder>
  </a-entity>
  <a-box hand-interactive="color: #e94560; hoverColor: #FFD700; activeColor: #FF9999" float-animation="amplitude: 0.06; speed: 1.2; phase: 0" position="-0.3 0.9 -1.8" width="0.12" height="0.12" depth="0.12" rotation="0 45 0" material="metalness: 0.3; roughness: 0.4" shadow></a-box>
  <a-sphere hand-interactive="color: #4CC3D9; hoverColor: #FFD700; activeColor: #99DDFF" float-animation="amplitude: 0.08; speed: 0.9; phase: 1.5" position="0 1.0 -1.8" radius="0.08" material="metalness: 0.5; roughness: 0.2" shadow></a-sphere>
  <a-dodecahedron hand-interactive="color: #7B2FBE; hoverColor: #FFD700; activeColor: #BB88FF" float-animation="amplitude: 0.05; speed: 1.5; phase: 3.0" position="0.3 0.85 -1.8" radius="0.09" material="metalness: 0.4; roughness: 0.3" shadow></a-dodecahedron>
  <a-torus hand-interactive="color: #FFC300; hoverColor: #FF6B6B; activeColor: #FFEE88" float-animation="amplitude: 0.07; speed: 1.1; phase: 4.5" position="0 1.15 -1.6" radius="0.07" radius-tubular="0.02" rotation="90 0 0" material="metalness: 0.6; roughness: 0.2" shadow></a-torus>
  <a-octahedron hand-interactive="color: #00B894; hoverColor: #FFD700; activeColor: #55EEBB" float-animation="amplitude: 0.09; speed: 0.8; phase: 2.0" position="-0.15 1.1 -2.0" radius="0.07" material="metalness: 0.5; roughness: 0.25" shadow></a-octahedron>
  <a-torus position="0 0.63 -1.8" rotation="90 0 0" radius="0.62" radius-tubular="0.005" material="color: #e94560; emissive: #e94560; emissiveIntensity: 0.8; transparent: true; opacity: 0.6" animation="property: rotation; to: 90 360 0; dur: 20000; loop: true; easing: linear"></a-torus>
  <a-text value="Greife Objekte mit\nDaumen + Zeigefinger" position="0 1.65 -1.8" align="center" color="#ffffff" width="1.5" opacity="0.8" animation="property: position; to: 0 1.7 -1.8; dir: alternate; dur: 2000; loop: true; easing: easeInOutSine"></a-text>
  <a-entity position="0 1.2 -1.8" animation="property: rotation; to: 0 360 0; dur: 15000; loop: true; easing: linear"><a-sphere position="1 0 0" radius="0.02" material="color: #e94560; emissive: #e94560; emissiveIntensity: 1" light="type: point; color: #e94560; intensity: 0.2; distance: 2"></a-sphere></a-entity>
  <a-entity position="0 1.0 -1.8" animation="property: rotation; to: 0 -360 0; dur: 12000; loop: true; easing: linear"><a-sphere position="0.8 0 0" radius="0.015" material="color: #4CC3D9; emissive: #4CC3D9; emissiveIntensity: 1" light="type: point; color: #4CC3D9; intensity: 0.15; distance: 1.5"></a-sphere></a-entity>
  <a-entity id="cameraRig" position="0 0 0">
    <a-camera position="0 1.6 0" wasd-controls="enabled: true" look-controls="pointerLockEnabled: false">
      <a-cursor fuse="false" raycaster="objects: .interactive" material="color: white; shader: flat" geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.008"></a-cursor>
    </a-camera>
    <a-entity id="leftHand" hand-tracking-controls="hand: left; modelColor: #4CC3D9; modelStyle: mesh" hand-collider="hand: left"></a-entity>
    <a-entity id="rightHand" hand-tracking-controls="hand: right; modelColor: #e94560; modelStyle: mesh" hand-collider="hand: right"></a-entity>
    <a-entity laser-controls="hand: left" raycaster="objects: .interactive; showLine: true; lineColor: #4CC3D9; lineOpacity: 0.5; far: 5"></a-entity>
    <a-entity laser-controls="hand: right" raycaster="objects: .interactive; showLine: true; lineColor: #e94560; lineOpacity: 0.5; far: 5"></a-entity>
  </a-entity>
</a-scene>
</body>
</html>
